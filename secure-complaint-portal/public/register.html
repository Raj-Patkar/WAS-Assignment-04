<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Secure Complaint Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <h1>Create Account</h1>

        <p>Register as a student.</p>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    maxlength="50"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn full"
            >
                Create Account
            </button>

        </form>


        <div id="message"></div>


        <p style="margin-top: 20px">

            Already registered?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

    <script src="app.js"></script>
    
</body>

</html>
