<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="navbar">

        <div class="logo">
            SecureComplaint
        </div>

        <button
            id="logoutBtn"
            class="btn secondary"
        >
            Logout
        </button>

    </div>


    <main class="dashboard">

        <div class="dashboard-header">

            <div>

                <h1>
                    Student Dashboard
                </h1>

                <p id="welcomeText">
                    Loading...
                </p>

            </div>

        </div>


        <!-- SECURITY STATUS -->

        <div class="security-panel">

            <h2>
                Security Controls
            </h2>


            <div class="security-control">

                <span>
                    Authentication
                </span>

                <span class="security-on">
                    ACTIVE
                </span>

            </div>


            <div class="security-control">

                <span>
                    Session Protection
                </span>

                <span class="security-on">
                    ACTIVE
                </span>

            </div>


            <div class="security-control">

                <span>
                    Input Validation
                </span>

                <span class="security-on">
                    ACTIVE
                </span>

            </div>


            <div class="security-control">

                <span>
                    Authorization
                </span>

                <span class="security-on">
                    ACTIVE
                </span>

            </div>


            <div class="security-control">

                <span>
                    Audit Logging
                </span>

                <span class="security-on">
                    ACTIVE
                </span>

            </div>

        </div>


        <!-- SUBMIT COMPLAINT -->

        <div class="card">

            <h2>
                Submit a Complaint
            </h2>

            <br>


            <form id="complaintForm">

                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        maxlength="100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="description"
                        maxlength="1000"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Submit Complaint
                </button>

            </form>


            <div id="complaintMessage"></div>

        </div>


        <br><br>


        <!-- MY COMPLAINTS -->

        <div class="table-container">

            <h2>
                My Complaints
            </h2>

            <br>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Subject</th>

                        <th>Status</th>

                        <th>Date</th>

                    </tr>

                </thead>


                <tbody id="complaintsTable">

                </tbody>

            </table>

        </div>

    </main>


    <script src="app.js"></script>

</body>

</html>
